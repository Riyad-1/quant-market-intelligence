services:
  db:
    image: pgvector/pgvector:pg17
    container_name: qmi_postgres
    environment:
      POSTGRES_USER: qmi_user
      POSTGRES_PASSWORD: changeme_in_production
      POSTGRES_DB: qmi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmi_user -d qmi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
